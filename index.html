<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Fighter II Turbo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070c'/%3E%3Cpath d='M12 44 L26 16 L52 16 L38 30 L50 30 L20 52 L28 34 L12 34 Z' fill='%23f59e0b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --gold: #fbbf24;
      --red: #ef4444;
      --xbox: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --surface: rgba(12, 16, 26, 0.94);
      --border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Full-Bleed Arcade Stage (fills 100% of screen automatically) */
    #arcade-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #game {
      width: 100% !important;
      height: 100% !important;
    }

    /* Hide EmulatorJS PC chrome / bottom bar / virtual touch clutter so it never traps console/Xbox users */
    .ejs_menu_bar,
    .ejs_menu_bar_hidden,
    .ejs_virtualGamepad_parent,
    .ejs_context_menu,
    .ejs_cheats_box,
    .ejs_netplay_box {
      display: none !important;
      pointer-events: none !important;
    }

    /* Optional CRT scanlines */
    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 6px 100%;
      opacity: 0.72;
      transition: opacity 0.2s ease;
    }

    .crt-overlay.disabled { opacity: 0; }

    /* Minimal Auto-Hiding HUD Bar (fades completely out during play) */
    .hud-float {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hud-float.faded {
      opacity: 0;
    }

    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(8, 11, 18, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .hud-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #475569;
    }

    .hud-pill.online .hud-dot {
      background: var(--xbox);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.9);
    }

    .hud-hint {
      color: var(--muted);
      font-weight: 500;
    }

    .hud-btn-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(8, 11, 18, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .hud-btn:hover, .hud-btn:focus-visible {
      background: rgba(251, 191, 36, 0.2);
      border-color: var(--gold);
      outline: none;
    }

    /* Fullscreen Splash Overlay (One-click or Press A to unlock audio + fullscreen) */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 42%, rgba(220, 38, 38, 0.24) 0%, rgba(5, 7, 12, 0.92) 62%),
        rgba(5, 7, 12, 0.92);
      backdrop-filter: blur(6px);
      transition: opacity 0.25s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .splash-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(20px, 4vw, 38px);
      line-height: 1.35;
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 55%, #dc2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      filter: drop-shadow(0 6px 24px rgba(220, 38, 38, 0.35));
    }

    .splash-sub {
      font-size: clamp(13px, 1.6vw, 16px);
      color: var(--muted);
      margin-bottom: 28px;
    }

    .splash-play-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 1.8vw, 15px);
      padding: 18px 34px;
      border-radius: 14px;
      border: 2px solid var(--gold);
      background: linear-gradient(135deg, #dc2626 0%, #f59e0b 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.45);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .splash-play-btn:hover, .splash-play-btn:focus-visible {
      transform: scale(1.04);
      box-shadow: 0 0 44px rgba(251, 191, 36, 0.7);
      outline: none;
    }

    .splash-pad-status {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .splash-pad-status.online {
      border-color: rgba(16, 185, 129, 0.55);
      color: #a7f3d0;
    }

    .splash-controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      max-width: 520px;
      line-height: 1.55;
    }

    /* Xbox-Controller-Navigable Quick Menu Overlay */
    #quick-menu {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
    }

    #quick-menu.open {
      display: flex;
    }

    .menu-card {
      width: 100%;
      max-width: 460px;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
    }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .menu-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--gold);
    }

    .menu-pad-info {
      font-size: 12px;
      color: #a7f3d0;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      color: #e2e8f0;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .menu-item .val {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .menu-item.selected,
    .menu-item:hover {
      background: rgba(251, 191, 36, 0.16);
      border-color: var(--gold);
      color: #fff;
      transform: translateX(3px);
    }

    .menu-item.selected .val {
      color: var(--gold);
    }

    .menu-footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    /* Compact Move List Sub-View inside Quick Menu */
    #moves-view {
      display: none;
    }

    #moves-view.active {
      display: block;
    }

    .moves-scroll {
      max-height: 58dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .mv-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .mv-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .mv-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 2px 0;
      color: #e2e8f0;
    }

    .mv-cmd {
      color: #7dd3fc;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="arcade-root">
    <div id="game-wrap">
      <div id="game"></div>
    </div>
    <div class="crt-overlay" id="crt-overlay"></div>

    <!-- Auto-hiding minimal corner bar (fades completely out during gameplay) -->
    <div class="hud-float" id="hud-float">
      <div class="hud-pill" id="hud-pad-pill">
        <span class="hud-dot"></span>
        <span id="hud-pad-text">Xbox Controller Ready</span>
        <span class="hud-hint">· Hold BACK + START for Menu</span>
      </div>
      <div class="hud-btn-group">
        <button class="hud-btn" id="btn-hud-fs" type="button">Fullscreen</button>
        <button class="hud-btn" id="btn-hud-menu" type="button">Menu</button>
      </div>
    </div>

    <!-- Xbox-Navigable Quick Menu -->
    <div id="quick-menu" role="dialog" aria-modal="true" aria-label="Arcade Quick Menu">
      <div class="menu-card">
        <div class="menu-head">
          <span class="menu-title" id="menu-title">ARCADE MENU</span>
          <span class="menu-pad-info" id="menu-pad-info">P1 Ready</span>
        </div>

        <div class="menu-list" id="menu-list">
          <button class="menu-item selected" data-action="resume" type="button">
            <span>Resume Fight</span><span class="val">B</span>
          </button>
          <button class="menu-item" data-action="fullscreen" type="button">
            <span>Fullscreen</span><span class="val" id="val-fs">Enter</span>
          </button>
          <button class="menu-item" data-action="layout" type="button">
            <span>Button Layout</span><span class="val" id="val-layout">Xbox 6-Button</span>
          </button>
          <button class="menu-item" data-action="crt" type="button">
            <span>CRT Scanlines</span><span class="val" id="val-crt">On</span>
          </button>
          <button class="menu-item" data-action="mute" type="button">
            <span>Sound</span><span class="val" id="val-mute">On</span>
          </button>
          <button class="menu-item" data-action="swap" type="button">
            <span>Swap P1 ↔ P2</span><span class="val" id="val-swap">Normal</span>
          </button>
          <button class="menu-item" data-action="moves" type="button">
            <span>Special Move List</span><span class="val">12 Fighters</span>
          </button>
          <button class="menu-item" data-action="reset" type="button">
            <span>Reset Game</span><span class="val">Restart</span>
          </button>
        </div>

        <div id="moves-view">
          <div class="moves-scroll" id="moves-scroll"></div>
        </div>

        <div class="menu-footer">
          <span>D-Pad / Stick: Navigate</span>
          <span>A: Select · B: Back</span>
        </div>
      </div>
    </div>
  </div>

  <script src="xbox-controller.js"></script>
  <script>
    // Full 12-Fighter Move List for Quick Menu
    const FIGHTERS = [
      ['RYU & KEN', [['Hadouken', '↓ ↘ → + P'], ['Shoryuken', '→ ↓ ↘ + P'], ['Hurricane Kick', '↓ ↙ ← + K']]],
      ['CHUN-LI', [['Kikoken', '← [hold] → + P'], ['Lightning Legs', 'Tap Kick'], ['Spinning Bird', '↓ [hold] ↑ + K']]],
      ['GUILE', [['Sonic Boom', '← [hold] → + P'], ['Flash Kick', '↓ [hold] ↑ + K']]],
      ['BLANKA', [['Electric Thunder', 'Tap Punch'], ['Rolling Attack', '← [hold] → + P'], ['Vertical Roll', '↓ [hold] ↑ + K']]],
      ['E. HONDA', [['Hundred Hand', 'Tap Punch'], ['Sumo Headbutt', '← [hold] → + P'], ['Sumo Smash', '↓ [hold] ↑ + K']]],
      ['ZANGIEF', [['Spinning Piledriver', '360° + P'], ['Double Lariat', '3P or 3K']]],
      ['DHALSIM', [['Yoga Fire', '↓ ↘ → + P'], ['Yoga Flame', '← ↙ ↓ ↘ → + P'], ['Yoga Teleport', '→ ↓ ↘ + 3P/3K']]],
      ['BALROG', [['Dash Straight', '← [hold] → + P'], ['Dash Upper', '← [hold] → + K'], ['Turn Punch', 'Hold 3P/3K']]],
      ['VEGA', [['Rolling Flash', '← [hold] → + P'], ['Barcelona', '↓ [hold] ↑ + K, P']]],
      ['SAGAT', [['Tiger Shot', '↓ ↘ → + P/K'], ['Tiger Uppercut', '→ ↓ ↘ + P'], ['Tiger Knee', '↓ ↘ → ↗ + K']]],
      ['M. BISON', [['Psycho Crusher', '← [hold] → + P'], ['Knee Press', '← [hold] → + K'], ['Head Press', '↓ [hold] ↑ + K']]]
    ];

    document.getElementById('moves-scroll').innerHTML = FIGHTERS.map(([name, moves]) => `
      <div class="mv-card">
        <div class="mv-name">${name}</div>
        ${moves.map(([m, c]) => `<div class="mv-row"><span>${m}</span><span class="mv-cmd">${c}</span></div>`).join('')}
      </div>
    `).join('');

    // EmulatorJS Configuration (clean full-bleed Snes9x, no PC toolbar)
    window.EJS_player = '#game';
    window.EJS_core = 'snes';
    window.EJS_gameName = 'Street Fighter II Turbo';
    window.EJS_gameUrl = 'roms/StreetFighter2Turbo.sfc';
    window.EJS_pathtodata = 'vendor/emulatorjs/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_DEBUG_XX = true;
    window.EJS_disableDatabases = true;
    window.EJS_backgroundColor = '#000000';
    window.EJS_Buttons = {
      playPause: false, restart: false, mute: false, settings: false,
      fullscreen: false, saveState: false, loadState: false, screenRecord: false,
      gamepad: false, cheat: false, volume: false, saveSavFiles: false,
      loadSavFiles: false, quickSave: false, quickLoad: false, screenshot: false,
      cacheManager: false, exitEmulation: false
    };
    window.EJS_defaultOptions = {
      'snes9x_aspect': '4:3',
      'snes9x_region': 'Auto'
    };

    const emuScript = document.createElement('script');
    emuScript.src = 'vendor/emulatorjs/data/loader.js';
    document.body.appendChild(emuScript);

    // State
    const rootEl = document.getElementById('arcade-root');
    const menuEl = document.getElementById('quick-menu');
    const menuListEl = document.getElementById('menu-list');
    const movesViewEl = document.getElementById('moves-view');
    const movesScrollEl = document.getElementById('moves-scroll');
    const hudFloatEl = document.getElementById('hud-float');
    const crtEl = document.getElementById('crt-overlay');

    let menuItems = Array.from(menuListEl.querySelectorAll('.menu-item'));
    let selectedIndex = 0;
    let inMovesView = false;
    let isMuted = false;
    let hudTimer = null;

    function unlockAudio() {
      if (window.EJS_emulator && window.EJS_emulator.audioContext && window.EJS_emulator.audioContext.state === 'suspended') {
        window.EJS_emulator.audioContext.resume().catch(() => {});
      }
    }

    function showHudTemporarily(ms = 4500) {
      hudFloatEl.classList.remove('faded');
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        if (!menuEl.classList.contains('open')) {
          hudFloatEl.classList.add('faded');
        }
      }, ms);
    }

    function toggleFullscreen() {
      unlockAudio();
      if (!document.fullscreenElement) {
        (rootEl.requestFullscreen || document.documentElement.requestFullscreen).call(rootEl).catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
      updateMenuValues();
    }

    function updateMenuValues() {
      document.getElementById('val-fs').textContent = document.fullscreenElement ? 'Exit' : 'Enter';
      document.getElementById('val-layout').textContent = xbox.getLayout().name;
      document.getElementById('val-crt').textContent = crtEl.classList.contains('disabled') ? 'Off' : 'On';
      document.getElementById('val-mute').textContent = isMuted ? 'Muted' : 'On';
      document.getElementById('val-swap').textContent = xbox.swapped ? 'Swapped' : 'Normal';
    }

    function setSelected(idx) {
      selectedIndex = (idx + menuItems.length) % menuItems.length;
      menuItems.forEach((el, i) => el.classList.toggle('selected', i === selectedIndex));
      menuItems[selectedIndex].scrollIntoView({ block: 'nearest' });
    }

    function openMenu() {
      inMovesView = false;
      menuListEl.style.display = 'flex';
      movesViewEl.classList.remove('active');
      document.getElementById('menu-title').textContent = 'ARCADE MENU';
      updateMenuValues();
      setSelected(0);
      menuEl.classList.add('open');
      hudFloatEl.classList.remove('faded');
      xbox.setMenuOpen(true);
    }

    function closeMenu() {
      inMovesView = false;
      menuEl.classList.remove('open');
      xbox.setMenuOpen(false);
      showHudTemporarily(3000);
    }

    function toggleMenu() {
      if (menuEl.classList.contains('open')) closeMenu();
      else openMenu();
    }

    function runMenuAction(action) {
      if (action === 'resume') {
        closeMenu();
      } else if (action === 'fullscreen') {
        toggleFullscreen();
      } else if (action === 'layout') {
        xbox.toggleLayout();
        updateMenuValues();
      } else if (action === 'crt') {
        crtEl.classList.toggle('disabled');
        updateMenuValues();
      } else if (action === 'mute') {
        isMuted = !isMuted;
        if (window.EJS_emulator && typeof window.EJS_emulator.setVolume === 'function') {
          window.EJS_emulator.setVolume(isMuted ? 0 : 1);
        }
        updateMenuValues();
      } else if (action === 'swap') {
        xbox.swapPlayers();
        updateMenuValues();
      } else if (action === 'moves') {
        inMovesView = true;
        menuListEl.style.display = 'none';
        movesViewEl.classList.add('active');
        document.getElementById('menu-title').textContent = 'SPECIAL MOVES (B: BACK)';
        movesScrollEl.scrollTop = 0;
      } else if (action === 'reset') {
        if (window.EJS_emulator && window.EJS_emulator.gameManager && typeof window.EJS_emulator.gameManager.restart === 'function') {
          window.EJS_emulator.gameManager.restart();
          closeMenu();
        } else {
          window.location.reload();
        }
      }
    }

    // Initialize Xbox Arcade Controller immediately (zero splash screen)
    const xbox = new XboxArcadeController({
      onStatusChange(status) {
        const [p1, p2] = status.players;
        const count = (p1.connected ? 1 : 0) + (p2.connected ? 1 : 0);
        const label = count === 2
          ? `1P ${p1.name} · 2P ${p2.name}`
          : (count === 1 ? `1P ${p1.name} Ready` : 'Xbox Controller Ready');

        document.getElementById('hud-pad-pill').classList.toggle('online', count > 0);
        document.getElementById('hud-pad-text').textContent = label;
        document.getElementById('menu-pad-info').textContent = count > 0 ? label : 'Keyboard / Xbox';
        updateMenuValues();
        if (count > 0) showHudTemporarily(3500);
      },
      onMenuToggle() {
        toggleMenu();
      },
      onMenuNav(cmd) {
        if (inMovesView) {
          if (cmd === 'UP') movesScrollEl.scrollBy({ top: -110, behavior: 'smooth' });
          else if (cmd === 'DOWN') movesScrollEl.scrollBy({ top: 110, behavior: 'smooth' });
          else if (cmd === 'BACK') {
            inMovesView = false;
            movesViewEl.classList.remove('active');
            menuListEl.style.display = 'flex';
            document.getElementById('menu-title').textContent = 'ARCADE MENU';
          }
          return;
        }
        if (cmd === 'UP') setSelected(selectedIndex - 1);
        else if (cmd === 'DOWN') setSelected(selectedIndex + 1);
        else if (cmd === 'CONFIRM') runMenuAction(menuItems[selectedIndex].dataset.action);
        else if (cmd === 'BACK') closeMenu();
      }
    });

    xbox.start();
    showHudTemporarily(5000);

    // Mouse / Pointer / Keyboard bindings
    document.addEventListener('pointerdown', unlockAudio);
    document.getElementById('btn-hud-fs').addEventListener('click', toggleFullscreen);
    document.getElementById('btn-hud-menu').addEventListener('click', toggleMenu);
    menuItems.forEach((btn, i) => {
      btn.addEventListener('mouseenter', () => setSelected(i));
      btn.addEventListener('click', () => runMenuAction(btn.dataset.action));
    });

    document.addEventListener('mousemove', () => showHudTemporarily(3500));
    document.addEventListener('fullscreenchange', updateMenuValues);

    window.addEventListener('keydown', (e) => {
      unlockAudio();
      if (e.key === 'Escape') {
        e.preventDefault();
        toggleMenu();
      } else if (menuEl.classList.contains('open')) {
        if (e.key === 'ArrowUp') { e.preventDefault(); xbox.onMenuNav('UP'); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); xbox.onMenuNav('DOWN'); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); xbox.onMenuNav('CONFIRM'); }
        else if (e.key === 'Backspace') { e.preventDefault(); xbox.onMenuNav('BACK'); }
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
